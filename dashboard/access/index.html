<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facilitator Dashboard Access | KAINDLY</title>
  <meta name="description" content="Private access to the KAINDLY facilitator dashboard.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/brand/icon-violet.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="dashboard-auth-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main id="main-content" class="dashboard-auth-shell">
    <section class="dashboard-auth-card" aria-labelledby="access-title">
      <a class="dashboard-brand" href="/" aria-label="KAINDLY facilitator dashboard"><img src="/assets/brand/logo-secondary-violet.svg" alt="KAINDLY" width="166" height="32"></a>
      <p class="dashboard-eyebrow">Private facilitator workspace</p>
      <h1 id="access-title">Facilitator dashboard access</h1>
      <p>Enter your private facilitator passphrase. Keep it separate from the participant workshop PIN.</p>
      <form class="dashboard-auth-form" method="post" action="/dashboard/access/">
        <label for="facilitator-passphrase">Facilitator passphrase</label>
        <input id="facilitator-passphrase" type="password" name="passphrase" autocomplete="current-password" minlength="16" maxlength="256" required>
        <input type="hidden" name="returnTo" value="/dashboard/owr/" id="passphrase-return">
        <button class="dashboard-button dashboard-button--primary" type="submit">Open facilitator workspace</button>
      </form>
      <p role="status" id="passphrase-status"></p>
    </section>
  </main>
  <script src="/assets/js/dashboard-passphrase.js" defer></script>
</body>
</html>
